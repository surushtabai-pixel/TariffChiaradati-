name: Aggiorna tariffe ARERA
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estrai le tariffe
        run: python arera_tariffe.py estrai
      - name: Diagnostica e salva
        run: |
          echo "=== Contenuto cartella ==="
          ls -la
          echo "=== Cerco file json/csv ==="
          find . -name "tariffe_luce.*" -maxdepth 2
          git config user.name "tariffe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f tariffe_luce.json || echo "json non trovato"
          git add -f tariffe_luce.csv || echo "csv non trovato"
          git commit -m "Aggiorna tariffe ARERA" || echo "niente da committare"
          git push || echo "push non riuscito"
